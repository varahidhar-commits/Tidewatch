version: "3.9"

services:
  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=tidewatch
      - PGPASSWORD=tidewatch
      - PGDATABASE=tidewatch
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=tidewatch
      - POSTGRES_PASSWORD=tidewatch
      - POSTGRES_DB=tidewatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
